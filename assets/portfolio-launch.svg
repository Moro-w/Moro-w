<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Moro — Crimson editorial intro</title>
  <desc id="desc">Animated editorial cover for 王博文 (Moro)</desc>

  <defs>
    <radialGradient id="glow" cx="72%" cy="16%" r="75%">
      <stop offset="0%" stop-color="#b62b1a" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#6e1710" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

    .topline { fill: #62666d; font-size: 13px; letter-spacing: 6px; opacity: 0; animation: fade 9s ease-in-out infinite; animation-delay: .2s; }
    .name { fill: #ffffff; font-size: 112px; font-weight: 300; letter-spacing: -0.025em; opacity: 0; animation: rise 9s ease-in-out infinite; animation-delay: .5s; }
    .line-grow { transform: scaleX(0); transform-box: fill-box; transform-origin: center; animation: grow 9s ease-in-out infinite; animation-delay: 1.2s; }
    .moro { fill: #d0d6e0; font-size: 54px; font-weight: 300; letter-spacing: 20px; opacity: 0; animation: fade 9s ease-in-out infinite; animation-delay: 1.8s; }
    .enter { fill: #62666d; font-size: 12px; letter-spacing: 6px; opacity: 0; animation: fade 9s ease-in-out infinite; animation-delay: 2.4s; }
    .arrow { fill: #b62b1a; font-size: 18px; animation: breathe 2.2s ease-in-out infinite; }

    /* 故障抖动副本 */
    .glitch-red { fill: #b62b1a; font-size: 112px; font-weight: 300; letter-spacing: -0.025em; opacity: 0; animation: glitchR 9s steps(1) infinite; }
    .glitch-cyan { fill: #02b8cc; font-size: 112px; font-weight: 300; letter-spacing: -0.025em; opacity: 0; animation: glitchC 9s steps(1) infinite; }

    @keyframes fade {
      0%, 6% { opacity: 0; transform: translateY(8px); }
      10%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes rise {
      0%, 7% { opacity: 0; transform: translateY(26px); }
      13%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      0%, 16% { transform: scaleX(0); }
      30%, 100% { transform: scaleX(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .25; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(6px); }
    }
    @keyframes glitchR {
      0%, 46%, 49.2%, 53%, 100% { opacity: 0; transform: translate(0, 0); }
      46.4% { opacity: .55; transform: translate(-4px, 1px); }
      47.6% { opacity: .55; transform: translate(3px, -1px); }
      50.4% { opacity: .5; transform: translate(-2px, 0); }
    }
    @keyframes glitchC {
      0%, 46%, 49.2%, 53%, 100% { opacity: 0; transform: translate(0, 0); }
      46.8% { opacity: .5; transform: translate(4px, -1px); }
      48.4% { opacity: .5; transform: translate(-3px, 1px); }
      51.2% { opacity: .45; transform: translate(2px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .topline, .name, .moro, .enter { animation: none; opacity: 1; transform: none; }
      .line-grow { animation: none; transform: scaleX(1); }
      .glitch-red, .glitch-cyan { animation: none; opacity: 0; }
      .arrow { animation: none; }
    }
  </style>

  <rect width="1000" height="520" fill="#000000"/>
  <rect width="1000" height="520" fill="url(#glow)"/>

  <text class="mono topline" x="500" y="72" text-anchor="middle">MORO · PORTFOLIO · 2025</text>

  <!-- 主标题 + 故障副本（三层叠放，只在故障时刻闪现红/青） -->
  <text class="sans glitch-cyan" x="500" y="252" text-anchor="middle">王博文</text>
  <text class="sans glitch-red" x="500" y="252" text-anchor="middle">王博文</text>
  <text class="sans name" x="500" y="252" text-anchor="middle">王博文</text>

  <rect class="line-grow" x="360" y="300" width="280" height="2" fill="#b62b1a"/>

  <text class="sans moro" x="500" y="390" text-anchor="middle">M O R O</text>

  <text class="mono enter" x="480" y="462" text-anchor="end">ENTER</text>
  <text class="mono arrow" x="492" y="463" text-anchor="start">→</text>
</svg>
