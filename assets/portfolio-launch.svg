<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Moro — Synthwave pixel intro</title>
  <desc id="desc">Pixel-art synthwave sunset for 王博文 (Moro)</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="35%" stop-color="#3b1d8f"/>
      <stop offset="60%" stop-color="#b537f2"/>
      <stop offset="82%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6b0"/>
      <stop offset="55%" stop-color="#ffd319"/>
      <stop offset="100%" stop-color="#ff7e29"/>
    </radialGradient>
  </defs>

  <style>
    .star { animation: blink 2.4s steps(1) infinite; }
    .cloud { animation: drift 32s linear infinite; }
    .moro { opacity: 0; animation: fadein 1.6s ease forwards; animation-delay: .9s; }
    @keyframes blink { 0%,100% {opacity:1} 50% {opacity:.15} }
    @keyframes drift { from {transform:translateX(-160px)} to {transform:translateX(1160px)} }
    @keyframes fadein { to {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .star, .cloud { animation: none; }
      .moro { animation: none; opacity: 1; }
    }
  </style>

  <rect width="1000" height="520" fill="url(#sky)"/>

